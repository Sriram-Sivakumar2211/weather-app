<!DOCTYPE html>
<html>
<head>
    <title>Weather App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4e73df, #1cc88a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 350px;
        }

        h1 {
            margin-bottom: 20px;
        }

        input {
            padding: 10px;
            width: 70%;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
        }

        button {
            padding: 10px 15px;
            border: none;
            background-color: #4e73df;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #2e59d9;
        }

        #weather-info {
            margin-top: 20px;
            font-size: 18px;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1> Weather App</h1>

        <form id="location-form">
            <input type="text" id="location" placeholder="Enter city name" required>
            <button type="submit">Get Weather</button>
        </form>

        <div id="weather-info"></div>
    </div>

    <script>
        const weatherInfoDiv = document.getElementById('weather-info');
        const locationInput = document.getElementById('location');

        document.getElementById('location-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const location = locationInput.value;

            const response = await fetch(`/weather?location=${encodeURIComponent(location)}`);
            const weatherData = await response.json();

            if (!weatherData.error) {
                weatherInfoDiv.innerHTML = `
                    <p><strong>City:</strong> ${weatherData.city}</p>
                    <p><strong>Temperature:</strong> ${weatherData.temperature}</p>
                    <p><strong>Weather:</strong> ${weatherData.description}</p>
                `;
            } else {
                weatherInfoDiv.innerHTML = `<p class="error">${weatherData.error}</p>`;
            }
        });
    </script>
</body>
</html>
